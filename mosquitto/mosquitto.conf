# Broker MQTT local pour le développement : pas d'authentification, pas de TLS.
listener 1883
allow_anonymous true

# WebSocket : pour la borne virtuelle (outils/borne-virtuelle), qui tourne dans un navigateur.
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
