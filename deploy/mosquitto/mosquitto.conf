# Broker MQTT de production.
# - Personne ne se connecte sans identifiant (un compte par borne + un compte pour l'API).
# - Chaque borne ne peut écrire et lire que ses propres topics (fichier acl).
# - Depuis Internet, seul le port 8883 est ouvert, et il est chiffré en TLS.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# Réseau Docker interne : utilisé par l'API uniquement (port non publié dans docker-compose.prod.yml).
listener 1883

# Internet : les bornes. Certificat Let's Encrypt obtenu par Caddy, copié par deploy/sync-mqtt-cert.sh.
listener 8883
certfile /mosquitto/secrets/cert.pem
keyfile /mosquitto/secrets/key.pem
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
